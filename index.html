<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PinsFlow - VGreyDigitalStudio</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #f5f0ff; }
.nav { background: #d8b4fe; padding: 14px 20px; display: flex; gap: 10px; align-items: center; }
.nav-title { color: #6b21a8; font-weight: bold; font-size: 16px; margin-right: auto; }
.nav button { background: white; color: #9333ea; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; opacity: 0.7; }
.nav button.active, .nav button:hover { opacity: 1; box-shadow: 0 2px 8px rgba(147,51,234,0.2); }
.page { display: none; padding: 20px; max-width: 800px; margin: 0 auto; }
.page.active { display: block; }
h1 { color: #7e22ce; text-align: center; margin-bottom: 6px; font-size: 26px; }
.subtitle { text-align: center; color: #c084fc; margin-bottom: 20px; font-size: 14px; }
.card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(167,139,250,0.15); border: 1.5px solid #ede9fe; }
label { display: block; font-weight: bold; margin-bottom: 6px; color: #7e22ce; margin-top: 12px; font-size: 14px; }
input[type=text] { width: 100%; padding: 10px 14px; border: 1.5px solid #e9d5ff; border-radius: 10px; font-size: 14px; outline: none; background: #faf5ff; }
input:focus { border-color: #c084fc; }
.upload-box { border: 2px dashed #e9d5ff; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; color: #c084fc; background: #faf5ff; }
.upload-box:hover { border-color: #c084fc; color: #9333ea; }
#preview { max-width: 100%; max-height: 180px; border-radius: 10px; margin-top: 10px; display: none; }
.btn { background: #c084fc; color: white; border: none; padding: 12px 20px; border-radius: 12px; font-size: 15px; cursor: pointer; width: 100%; margin-top: 12px; font-weight: bold; letter-spacing: 0.5px; }
.btn:hover { background: #a855f7; }
.pins-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.pin-wrap { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 12px rgba(167,139,250,0.15); border: 1.5px solid #ede9fe; }
.pin-label { padding: 8px 12px; font-size: 12px; color: #7e22ce; font-weight: bold; background: #faf5ff; }
canvas { display: block; width: 100%; }
.dl-btn { display: block; margin: 6px 10px 10px; background: #c084fc; color: white; border: none; padding: 8px; border-radius: 8px; font-size: 12px; cursor: pointer; text-align: center; text-decoration: none; font-weight: bold; }
.dl-btn:hover { background: #a855f7; }
.planet-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.planet-card { border-radius: 14px; padding: 14px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
.planet-card.selected { border-color: #7e22ce; transform: scale(1.03); }
.planet-card .planet-name { font-weight: bold; font-size: 15px; }
.planet-card .planet-time { font-size: 12px; opacity: 0.85; margin-top: 2px; }
.planet-card .planet-icon { font-size: 26px; margin-bottom: 4px; }
.hours-list { max-height: 320px; overflow-y: auto; }
.hour-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-bottom: 1px solid #f5f0ff; font-size: 13px; flex-wrap: wrap; gap: 4px; }
.hour-row.current { background: #faf5ff; font-weight: bold; }
.planet-badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; color: white; }
.location-row { display: flex; gap: 8px; align-items: flex-end; }
.location-row input { flex: 1; }
.best-box { border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="nav">
  <span class="nav-title">🔮 PinsFlow</span>
  <button class="active" onclick="showPage('pins', this)">🎨 Generate Pins</button>
  <button onclick="showPage('planets', this)">🌟 Planetary Hours</button>
</div>

<!-- PAGE: Generate Pins -->
<div id="page-pins" class="page active">
  <br>
  <h1>🎨 Generate Pins</h1>
  <p class="subtitle">สร้าง Pinterest Pins สำหรับ VGreyDigitalStudio</p>
  <div class="card">
    <label>📷 อัปโหลดรูปสินค้า</label>
    <div class="upload-box" onclick="document.getElementById('img-input').click()">
      🖼️ กดเพื่อเลือกรูปสินค้า
    </div>
    <input type="file" id="img-input" accept="image/*" style="display:none" onchange="previewImage(event)">
    <img id="preview" />
    <label>✏️ ชื่อสินค้า</label>
    <input type="text" id="title-input" placeholder="เช่น Statue of Liberty Sketch Print" />
    <label>🔗 ลิงก์ Etsy ของสินค้านี้</label>
    <input type="text" id="url-input" placeholder="https://www.etsy.com/listing/..." />
    <button class="btn" onclick="generatePins()">✨ Generate Pins</button>
  </div>
  <div id="output"></div>
</div>

<!-- PAGE: Planetary Hours -->
<div id="page-planets" class="page">
  <br>
  <h1>🌟 Planetary Hours</h1>
  <p class="subtitle">เวลามงคลสำหรับการโพส Pinterest</p>
  <div class="card">
    <label>📍 เมือง</label>
    <div class="location-row">
      <input type="text" id="city-input" placeholder="Bangkok" value="Bangkok" />
      <button class="btn" style="width:auto;margin:0;padding:10px 18px" onclick="calcHours()">คำนวณ</button>
    </div>
    <div id="sun-info" style="margin-top:10px;font-size:13px;color:#c084fc;text-align:center"></div>
  </div>
  <div id="planet-filter" class="card" style="display:none">
    <label>🪐 กรองตามดาว</label>
    <div class="planet-grid" id="planet-buttons"></div>
  </div>
  <div id="best-times-card" class="card" style="display:none">
    <label>💜 เวลาแนะนำสำหรับ Pinterest</label>
    <div id="best-times"></div>
  </div>
  <div id="hours-card" class="card" style="display:none">
    <label>⏰ ตารางชั่วโมงดาววันนี้</label>
    <div class="hours-list" id="hours-list"></div>
  </div>
</div>

<script>
function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'planets') calcHours();
}

// ===== GENERATE PINS =====
let loadedImage = null;
const STYLES = [
  { name: "Lavender Dream", bg: "#f5f0ff", text: "#4c1d95", accent: "#a855f7" },
  { name: "Purple Night", bg: "#2e1065", text: "#f3e8ff", accent: "#c084fc" },
  { name: "Soft Rose", bg: "#fff0f9", text: "#831843", accent: "#d946ef" },
  { name: "Mint Fresh", bg: "#f0fdf4", text: "#14532d", accent: "#22c55e" },
  { name: "Cream Gold", bg: "#fefce8", text: "#713f12", accent: "#eab308" },
  { name: "Sky Blue", bg: "#f0f9ff", text: "#0c4a6e", accent: "#38bdf8" },
];

function previewImage(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.getElementById('preview');
    img.src = ev.target.result; img.style.display = 'block';
    const image = new Image();
    image.onload = () => { loadedImage = image; };
    image.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function generatePins() {
  const title = document.getElementById('title-input').value.trim();
  const url = document.getElementById('url-input').value.trim();
  const output = document.getElementById('output');
  if (!loadedImage) { alert('กรุณาอัปโหลดรูปสินค้าก่อนนะ 🌸'); return; }
  if (!title) { alert('กรุณาใส่ชื่อสินค้า'); return; }
  if (!url) { alert('กรุณาใส่ลิงก์ Etsy'); return; }
  output.innerHTML = '';
  const dlAll = document.createElement('button');
  dlAll.className = 'btn'; dlAll.style.cssText = 'max-width:600px;margin:0 auto 12px;display:block';
  dlAll.textContent = '⬇️ ดาวน์โหลดทั้งหมด'; dlAll.onclick = downloadAll;
  output.appendChild(dlAll);
  const grid = document.createElement('div'); grid.className = 'pins-grid';
  STYLES.forEach((style, i) => {
    const canvas = document.createElement('canvas');
    canvas.width = 600; canvas.height = 900; canvas.id = 'canvas-' + i;
    drawPin(canvas.getContext('2d'), loadedImage, title, url, style);
    const wrap = document.createElement('div'); wrap.className = 'pin-wrap';
    const lbl = document.createElement('div'); lbl.className = 'pin-label'; lbl.textContent = '🎨 ' + style.name;
    const dl = document.createElement('a'); dl.className = 'dl-btn'; dl.textContent = '⬇️ ดาวน์โหลด PNG';
    dl.href = canvas.toDataURL('image/png'); dl.download = `pin-${style.name.replace(/ /g,'-').toLowerCase()}.png`;
    wrap.appendChild(lbl); wrap.appendChild(canvas); wrap.appendChild(dl); grid.appendChild(wrap);
  });
  output.appendChild(grid);
}

function drawPin(ctx, img, title, url, style) {
  const W = 600, H = 900;
  ctx.fillStyle = style.bg; ctx.fillRect(0, 0, W, H);
  const imgH = 520, scale = Math.max(W/img.width, imgH/img.height);
  const drawW = img.width*scale, drawH = img.height*scale;
  ctx.drawImage(img, (W-drawW)/2, (imgH-drawH)/2, drawW, drawH);
  const grad = ctx.createLinearGradient(0, 380, 0, 520);
  grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, style.bg);
  ctx.fillStyle = grad; ctx.fillRect(0, 380, W, 140);
  ctx.fillStyle = style.accent; ctx.fillRect(40, 548, 80, 4);
  ctx.fillStyle = style.text; ctx.font = 'bold 24px sans-serif';
  wrapText(ctx, title, 40, 585, 520, 32);
  ctx.fillStyle = style.accent; ctx.font = '15px sans-serif';
  ctx.fillText(url.length > 55 ? url.substring(0,52)+'...' : url, 40, 860);
}

function wrapText(ctx, text, x, y, maxW, lh) {
  const words = text.split(' '); let line = '';
  for (let w of words) {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line.trim(), x, y); line = w+' '; y+=lh; if(y>820)break; }
    else line = test;
  }
  ctx.fillText(line.trim(), x, y);
}

function downloadAll() {
  STYLES.forEach((style, i) => {
    const a = document.createElement('a');
    a.href = document.getElementById('canvas-'+i).toDataURL('image/png');
    a.download = `pin-${style.name.replace(/ /g,'-').toLowerCase()}.png`;
    a.click();
  });
}

// ===== PLANETARY HOURS =====
const PLANETS = [
  { name: 'อาทิตย์', en: 'Sun', icon: '☀️', color: '#f59e0b', text: '#fff' },
  { name: 'จันทร์', en: 'Moon', icon: '🌙', color: '#94a3b8', text: '#fff' },
  { name: 'อังคาร', en: 'Mars', icon: '🔴', color: '#ef4444', text: '#fff' },
  { name: 'พุธ', en: 'Mercury', icon: '⚡', color: '#8b5cf6', text: '#fff' },
  { name: 'พฤหัส', en: 'Jupiter', icon: '🌀', color: '#3b82f6', text: '#fff' },
  { name: 'ศุกร์', en: 'Venus', icon: '💜', color: '#d946ef', text: '#fff' },
  { name: 'เสาร์', en: 'Saturn', icon: '🪐', color: '#374151', text: '#fff' },
];
const CHALDEAN = [2, 1, 4, 6, 0, 5, 3];
let selectedPlanet = null;
let allHours = [];

async function calcHours() {
  const city = document.getElementById('city-input').value.trim() || 'Bangkok';
  document.getElementById('sun-info').textContent = '⏳ กำลังคำนวณ...';
  try {
    const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1`);
    const geoData = await geoRes.json();
    if (!geoData.length) { document.getElementById('sun-info').textContent = '❌ ไม่พบเมืองนี้'; return; }
    const lat = parseFloat(geoData[0].lat), lon = parseFloat(geoData[0].lon);
    const now = new Date();
    const { sunrise, sunset } = getSunTimes(lat, lon, now);
    document.getElementById('sun-info').textContent = `📍 ${geoData[0].display_name.split(',')[0]} | 🌅 ${fmtTime(sunrise)} | 🌇 ${fmtTime(sunset)}`;
    allHours = calcPlanetaryHours(sunrise, sunset, now);
    renderHours(allHours);
    renderPlanetButtons();
    renderBestTimes(allHours);
    document.getElementById('planet-filter').style.display = 'block';
    document.getElementById('hours-card').style.display = 'block';
    document.getElementById('best-times-card').style.display = 'block';
  } catch(e) {
    document.getElementById('sun-info').textContent = '❌ เกิดข้อผิดพลาด';
  }
}

function getSunTimes(lat, lon, date) {
  const rad = Math.PI/180;
  const dayOfYear = Math.floor((date - new Date(date.getFullYear(),0,0))/86400000);
  const B = (360/365)*(dayOfYear-81)*rad;
  const eot = 9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
  const decl = 23.45*Math.sin(B)*rad;
  const ha = Math.acos(-Math.tan(lat*rad)*Math.tan(decl))/rad;
  const tz = date.getTimezoneOffset()/-60;
  const noon = 12-(lon/15-tz)-eot/60;
  const toDate = h => { const d = new Date(date); d.setHours(0,0,0,0); d.setTime(d.getTime()+h*3600000); return d; };
  return { sunrise: toDate(noon-ha/15), sunset: toDate(noon+ha/15) };
}

function calcPlanetaryHours(sunrise, sunset, ref) {
  const dayMs = sunset-sunrise, nightMs = 86400000-dayMs;
  const dayH = dayMs/12, nightH = nightMs/12;
  const jsDay = ref.getDay();
  const start = CHALDEAN.indexOf(jsDay);
  const hours = [];
  for (let i = 0; i < 24; i++) {
    const pidx = CHALDEAN[(start+i)%7];
    const isDay = i < 12;
    const s = isDay ? new Date(sunrise.getTime()+i*dayH) : new Date(sunset.getTime()+(i-12)*nightH);
    const e = isDay ? new Date(sunrise.getTime()+(i+1)*dayH) : new Date(sunset.getTime()+(i-11)*nightH);
    hours.push({ hour: i+1, planet: PLANETS[pidx], start: s, end: e, isDay });
  }
  return hours;
}

function fmtTime(d) { return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }); }

function renderHours(hours) {
  const now = new Date();
  const list = document.getElementById('hours-list'); list.innerHTML = '';
  hours.forEach(h => {
    if (selectedPlanet && h.planet.en !== selectedPlanet) return;
    const isCurrent = now >= h.start && now < h.end;
    const row = document.createElement('div'); row.className = 'hour-row'+(isCurrent?' current':'');
    row.innerHTML = `<span>${h.isDay?'☀️':'🌙'} ชั่วโมงที่ ${h.hour}</span>
      <span style="color:#9ca3af">${fmtTime(h.start)} – ${fmtTime(h.end)}</span>
      <span class="planet-badge" style="background:${h.planet.color}">${h.planet.icon} ${h.planet.name}</span>
      ${isCurrent?'<span style="color:#a855f7;font-size:11px">◀ ตอนนี้</span>':''}`;
    list.appendChild(row);
  });
}

function renderPlanetButtons() {
  const c = document.getElementById('planet-buttons'); c.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'planet-card'+(selectedPlanet?'':' selected');
  all.style.cssText = 'background:#f5f0ff;grid-column:span 2;border:1.5px solid #e9d5ff';
  all.innerHTML = `<div class="planet-icon">🌍</div><div class="planet-name" style="color:#7e22ce">แสดงทั้งหมด</div>`;
  all.onclick = () => { selectedPlanet = null; renderHours(allHours); renderPlanetButtons(); };
  c.appendChild(all);
  PLANETS.forEach(p => {
    const btn = document.createElement('div');
    btn.className = 'planet-card'+(selectedPlanet===p.en?' selected':'');
    btn.style.cssText = `background:${p.color}22;border:1.5px solid ${p.color}44`;
    const times = allHours.filter(h => h.planet.en === p.en);
    btn.innerHTML = `<div class="planet-icon">${p.icon}</div>
      <div class="planet-name" style="color:${p.color}">${p.name}</div>
      <div class="planet-time" style="color:${p.color}">${times.length} ชั่วโมง</div>`;
    btn.onclick = () => { selectedPlanet = p.en; renderHours(allHours); renderPlanetButtons(); };
    c.appendChild(btn);
  });
}

function renderBestTimes(hours) {
  const c = document.getElementById('best-times'); c.innerHTML = '';
  ['Venus','Jupiter','Sun'].forEach(en => {
    const p = PLANETS.find(x => x.en===en);
    const times = hours.filter(h => h.planet.en===en);
    const div = document.createElement('div');
    div.className = 'best-box';
    div.style.cssText = `background:${p.color}15;border:1px solid ${p.color}30;margin-bottom:8px`;
    div.innerHTML = `<strong style="color:${p.color}">${p.icon} ดาว${p.name}</strong><br>`+
      times.map(h=>`<span style="font-size:13px;color:#6b7280">⏰ ${fmtTime(h.start)} – ${fmtTime(h.end)} ${h.isDay?'🌤️':'🌙'}</span>`).join('<br>');
    c.appendChild(div);
  });
}
</script>
</body>
</html>
